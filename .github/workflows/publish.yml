name: publish
on:
  push:
    branches: [main]
    paths: ['cpv2/**', 'migrations/**', requirements.txt, Dockerfile, .github/workflows/publish.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: tenki-standard-autoscale
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/blockfield/blockfield-control-plane:main
