name: Deploy control plane
on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Image digest to deploy (sha256:...); empty deploys what :main currently serves"
        required: false
permissions:
  contents: read
  packages: write
concurrency:
  group: blockfield-control-plane-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: blockfield-deploy
    env:
      # Redeploys only the control plane's release-only :prod channel; no Dokploy API key in Actions.
      DOKPLOY_CP_WEBHOOK: ${{ secrets.DOKPLOY_CP_WEBHOOK }}
    # Rollout and its rollback at the deploy-webhooks.py limits.
    timeout-minutes: 60
    steps:
      - run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Deploy the digest, roll back to the running digest on failure
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          python3 - <<'PYCODE'
          import os, subprocess, sys
          sys.path.insert(0, 'scripts')
          hooks = __import__('deploy-webhooks')
          entry = [sys.executable, 'scripts/entry_liveness.py',
                   '--gate-file', '/srv/minecraft/workshop/gate/gate.json']
          image = 'ghcr.io/blockfield/blockfield-control-plane'
          digest = os.environ['DIGEST'] or hooks.registry_digest(f'{image}:main')
          if not hooks.DIGEST.fullmatch(digest):
              raise SystemExit(f'expected an immutable image digest, got {digest!r}')
          # Fail closed: without a known-good running digest there is no rollback target.
          previous = hooks.current('blockfield-control-plane')
          try:
              hooks.deploy('blockfield-control-plane', digest)
              # Synthetic post-deploy gate: a stale CP lease fails the proxy
              # closed, so entry must be re-proved after every CP deploy.
              probe = subprocess.run(entry, capture_output=True, text=True, timeout=300)
              if probe.returncode != 0:
                  raise SystemExit('entry dead after CP deploy:\n' + probe.stdout + probe.stderr)
          except BaseException:
              hooks.deploy('blockfield-control-plane', previous)
              recheck = subprocess.run(entry, capture_output=True, text=True, timeout=300)
              if recheck.returncode != 0:
                  raise SystemExit('entry still dead after CP rollback:\n' + recheck.stdout + recheck.stderr)
              raise
          PYCODE
