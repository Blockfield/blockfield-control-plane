name: Deploy control plane
on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Image digest to pin (sha256:...); empty pins what :latest currently serves"
        required: false
permissions:
  contents: read
  packages: read
concurrency:
  group: blockfield-control-plane-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: blockfield-deploy
    # Pin the digest, redeploy and verify; failure re-pins the running digest.
    timeout-minutes: 60
    env:
      # One-time owner setup (see docs/DEPLOY.md): DOKPLOY_API_URL (Dokploy
      # dashboard base URL) and DOKPLOY_API_TOKEN (profile settings -> API/CLI)
      # repository secrets. No registry credentials are stored in the app.
      DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
      DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
      DIGEST: ${{ inputs.digest }}
    steps:
      - run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pin the digest, redeploy and verify the running digest
        run: |
          set -euo pipefail
          # deploy() pins the digest, redeploys and verifies that every
          # running task serves it; on failure it re-pins the running digest.
          if [ -n "$DIGEST" ]; then
            python3 -I scripts/dokploy-pin.py deploy "$DIGEST"
          else
            python3 -I scripts/dokploy-pin.py deploy
          fi
