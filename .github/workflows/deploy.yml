name: Deploy control plane
on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Image digest to deploy (sha256:...); empty deploys what :main currently serves"
        required: false
permissions:
  contents: read
  packages: write
concurrency:
  group: blockfield-control-plane-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: blockfield-deploy
    env:
      # Redeploys only the control plane's release-only :prod channel; no Dokploy API key in Actions.
      DOKPLOY_CP_WEBHOOK: ${{ secrets.DOKPLOY_CP_WEBHOOK }}
      # The canonical script reads the Dokploy app name from the environment.
      DOKPLOY_CP_APP: blockfield-control-plane-xwcxgx
    # Rollout and its rollback at the canonical deploy limits.
    timeout-minutes: 60
    steps:
      - run: echo "DOCKER_CONFIG=$RUNNER_TEMP/docker" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve the deploy digest
        id: release
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          # Low priority on the shared self-hosted runner (server#351).
          renice -n 19 -p $$ >/dev/null; ionice -c3 -p $$ >/dev/null 2>&1 || true
          digest="${DIGEST:-}"
          if [ -z "$digest" ]; then
            digest="$(docker buildx imagetools inspect 'ghcr.io/blockfield/blockfield-control-plane:main' \
              --format '{{json .Manifest}}' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
          fi
          if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Expected an immutable image digest, got '$digest'" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Read the running digest for rollback
        id: previous
        # Fail closed: without a known-good running digest there is no rollback target.
        run: |
          # Low priority on the shared self-hosted runner (server#351).
          renice -n 19 -p $$ >/dev/null; ionice -c3 -p $$ >/dev/null 2>&1 || true
          python3 - <<'PYCODE'
          import json, os, subprocess, sys
          service = os.environ["DOKPLOY_CP_APP"]
          repository = "ghcr.io/blockfield/blockfield-control-plane"
          def docker(*args):
              try:
                  return subprocess.run(["docker", *args], text=True, capture_output=True,
                                        check=True, timeout=300).stdout.strip()
              except subprocess.CalledProcessError as error:
                  print(f"docker {' '.join(args[:4])}: {error.stderr.strip()[-400:]}",
                        file=sys.stderr, flush=True)
                  raise
          ids = docker("ps", "--no-trunc", "--filter",
                       "label=com.docker.swarm.service.name=" + service,
                       "--format", "{{.ID}}").split()
          tasks = []
          for cid in ids:
              container = json.loads(docker("inspect", cid))[0]
              imaged = json.loads(docker("image", "inspect", container["Image"]))[0]
              own = {d.split("@", 1)[1] for d in imaged.get("RepoDigests") or []
                     if d.startswith(repository + "@")}
              tasks.append(own)
          previous, error = None, None
          if len(tasks) != 1 or not tasks[0]:
              error = ("blockfield-control-plane: the running image is not one "
                       "ghcr.io/blockfield digest; no automatic rollback")
          else:
              for digest in sorted(tasks[0]):
                  try:
                      manifest = json.loads(docker("buildx", "imagetools", "inspect",
                                                   f"{repository}@{digest}",
                                                   "--format", "{{json .Manifest}}"))
                  except subprocess.CalledProcessError:
                      continue
                  if manifest["digest"] == digest:
                      previous = digest
                      break
              if previous is None:
                  error = ("blockfield-control-plane: the running image is gone "
                           "from the registry; no automatic rollback")
          if error is not None:
              raise SystemExit(f"{error}; refusing to deploy without a rollback target")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"previous={previous or ''}\n")
          PYCODE
      - name: Deploy the exact digest
        uses: Blockfield/blockfield-server/.github/actions/deploy-app@3a6c1ff83488631644092e20359a8c3c67f1a326
        with:
          app: control-plane
          digest: ${{ steps.release.outputs.digest }}
          webhook_url: ${{ secrets.DOKPLOY_CP_WEBHOOK }}
      - name: Check entry after deploy
        # Synthetic post-deploy gate: a stale CP lease fails the proxy
        # closed, so entry must be re-proved after every CP deploy.
        run: timeout 300 nice -n 19 ionice -c3 python3 scripts/entry_liveness.py --gate-file /srv/minecraft/workshop/gate/gate.json
      - name: Roll back to the running digest
        if: (failure() || cancelled()) && steps.previous.outputs.previous != ''
        uses: Blockfield/blockfield-server/.github/actions/deploy-app@3a6c1ff83488631644092e20359a8c3c67f1a326
        with:
          app: control-plane
          digest: ${{ steps.previous.outputs.previous }}
          webhook_url: ${{ secrets.DOKPLOY_CP_WEBHOOK }}
      - name: Check entry after rollback
        if: (failure() || cancelled()) && steps.previous.outputs.previous != ''
        run: timeout 300 nice -n 19 ionice -c3 python3 scripts/entry_liveness.py --gate-file /srv/minecraft/workshop/gate/gate.json
